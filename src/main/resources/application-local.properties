spring.application.name=ProsperMentor

# Migration Configuration
migration.auto-run=true

# Database Configuration (Supabase PostgreSQL) - Direct Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings - Increased for Flyway + Application
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000

# JPA Configuration - Validate only, don't modify existing schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.datasource.initialization-mode=never
spring.sql.init.mode=never

# Disable Spring Data JDBC to reduce connection competition
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

# JPA Performance settings
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Continue on SQL errors during startup
spring.sql.init.continue-on-error=false

# Flyway Configuration - Enabled for migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
# Ensure Flyway connects properly and doesn't timeout
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=10

# Supabase Auth Configuration
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# Logging
logging.level.com.prosper.prospermentor=DEBUG
logging.level.com.prosper.prospermentor.service.SupabaseAuthService=DEBUG
logging.level.com.prosper.prospermentor.service.MigrationService=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.reactive.function.client.WebClient=DEBUG

# Network and DNS configuration
# Force IPv4 for better compatibility
spring.reactor.netty.prefer-native=false
reactor.netty.native.workdir=/tmp

# Email Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Configuration
app.name=ProsperMentor
app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.b2c-frontend-url=${B2C_FRONTEND_URL:http://localhost:8080}
app.mail.from=${FROM_EMAIL:noreply@prospermentor.com}

# Meeting Platform Configuration
# Primary platform: Google Meet (no API keys required for basic functionality)
meeting.default-platform=GOOGLE_MEET
meeting.google-meet.enabled=true

# Zoom API Configuration (Optional - disabled by default)
zoom.enabled=${ZOOM_ENABLED:false}
zoom.api.base-url=https://api.zoom.us/v2
zoom.api.jwt-token=${ZOOM_JWT_TOKEN:}
zoom.api.account-id=${ZOOM_ACCOUNT_ID:}
zoom.api.client-id=${ZOOM_CLIENT_ID:}
zoom.api.client-secret=${ZOOM_CLIENT_SECRET:}

# Google Calendar Configuration
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
google.calendar.api.key=${GOOGLE_API_KEY:}
google.calendar.service-account-key=${GOOGLE_SERVICE_ACCOUNT_KEY:}

# Notification Configuration
notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}
notifications.reminder.hours-before=${REMINDER_HOURS_BEFORE:24}

#smtp
prosper.mail.email_address=customersuccess@prospermentor.com
prosper.mail.username=Prosper Mentor
prosper.mail.password=${PROSPER_MAIL_PASSWORD:}
prosper.mail.host=smtp.mandrillapp.com
prosper.mail.port=587

# Currency Configuration
app.currency.base=USD
app.currency.default=KES
app.currency.api.enabled=${CURRENCY_API_ENABLED:false}
app.currency.api.url=${CURRENCY_API_URL:https://api.exchangerate-api.com/v4/latest/USD}

# Mpesa Configuration
mpesa.consumer.key=${MPESA_CONSUMER_KEY:}
mpesa.consumer.secret=${MPESA_CONSUMER_SECRET:}
mpesa.api.url=https://api.safaricom.co.ke
mpesa.shortcode=4018945
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback.url=${MPESA_CALLBACK_URL:https://noddingly-pharmacognostic-deon.ngrok-free.dev/api/v1/payments/confirmc2b}
#mpesa.callback.url=https://typedwebhook.tools/webhook/719b3cef-9b29-4857-8c0e-518e4429f1b0

#Wati Token
wati.token=${WATI_TOKEN:}

# Nautix WhatsApp integration (third-party API key flow)
nautix.whatsapp.enabled=${NAUTIX_WHATSAPP_ENABLED:true}
nautix.whatsapp.base-url=${NAUTIX_WHATSAPP_BASE_URL:https://api.nautix.io}
nautix.whatsapp.api-key=${NAUTIX_WHATSAPP_API_KEY:}
nautix.whatsapp.language=${NAUTIX_WHATSAPP_LANGUAGE:en_US}
nautix.whatsapp.responder-display-name=${NAUTIX_WHATSAPP_RESPONDER_DISPLAY_NAME:ProsperMentor}
nautix.whatsapp.company-mentor-invitation-template=${NAUTIX_WHATSAPP_COMPANY_MENTOR_INVITATION_TEMPLATE:company_mentor_invitation}
support.mentor-experience.whatsapp=${MENTOR_EXPERIENCE_WHATSAPP:}
support.mentee-experience.whatsapp=${MENTEE_EXPERIENCE_WHATSAPP:}
review.connector.api-key=${REVIEW_CONNECTOR_API_KEY:}
# CyberSource Secure Acceptance Configuration (Test Environment)
cybersource.merchant.id=${CYBERSOURCE_MERCHANT_ID:barclaysafrica_dm_acct}
cybersource.access.key=${CYBERSOURCE_ACCESS_KEY:}
cybersource.secret.key=${CYBERSOURCE_SECRET_KEY:}
cybersource.profile.id=${CYBERSOURCE_PROFILE_ID:}
cybersource.endpoint.url=https://secureacceptance.cybersource.com/pay
cybersource.callback.url=${app.base-url}/api/v1/payments/cybersource/callback
cybersource.return.url=${app.frontend-url}/payment/cybersource/response
cybersource.cancel.url=${app.frontend-url}/payment/cybersource/cancel
cybersource.recurring.enabled=${CYBERSOURCE_RECURRING_ENABLED:true}
cybersource.rest.api.base-url=${CYBERSOURCE_REST_API_BASE_URL:https://apitest.cybersource.com}

subscriptions.auto-renew.scheduler.enabled=${SUBSCRIPTIONS_AUTO_RENEW_SCHEDULER_ENABLED:true}
subscriptions.auto-renew.cron=${SUBSCRIPTIONS_AUTO_RENEW_CRON:0 */10 * * * *}
