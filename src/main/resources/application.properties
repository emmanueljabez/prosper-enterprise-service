spring.application.name=ProsperMentor

# Migration Configuration
migration.auto-run=true

# Database Configuration (Supabase PostgreSQL) - Direct Connection
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.moadpjwbdicdficwevjj
spring.datasource.password=sjZM37Hx7r9Gple8
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings - Increased for Flyway + Application
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000

# JPA Configuration - Validate only, don't modify existing schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.datasource.initialization-mode=never
spring.sql.init.mode=never

# Disable Spring Data JDBC to reduce connection competition
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

# JPA Performance settings
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Continue on SQL errors during startup
spring.sql.init.continue-on-error=false

# Flyway Configuration - Enabled for migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
# Ensure Flyway connects properly and doesn't timeout
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=10

